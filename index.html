<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlwaysCloudedd</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>

<body>

  <canvas id="particles"></canvas>

  <div class="card">
    <h1 class="name" data-text="AlwaysCloudedd">AlwaysCloudedd</h1>
    <p class="title">Developer • Creator • Clouded Mind</p>

    <div class="socials">
      <a href="https://github.com/AlwaysCloudedd" target="_blank"><i class='bx bxl-github'></i></a>
      <a href="https://discord.com/users/1360925264669966338" target="_blank"><i class='bx bxl-discord-alt'></i></a>
      <a href="https://instagram.com/YOUR-IG" target="_blank"><i class='bx bxl-instagram'></i></a>
    </div>
  </div>

  <!-- DISCORD PROFILE PANEL -->
  <div id="discord-profile">
    <img id="dp-avatar" src="" alt="Avatar">

    <div class="dp-info">
      <h2 id="dp-username">Loading...</h2>

      <div class="dp-status-row">
        <span id="dp-status-dot"></span>
        <p id="dp-status-text">Checking...</p>
      </div>

      <p id="dp-custom-status" class="dp-custom">No active custom status</p>
    </div>
  </div>

  <!-- SPOTIFY NOW PLAYING BAR -->
  <div id="spotify-bar">
    <img id="spotify-cover" src="" alt="Album Art">
    <div class="spotify-info">
      <h3 id="spotify-title">Not playing anything</h3>
      <p id="spotify-artist"></p>
    </div>
  </div>

  <audio id="bgm" src="assets/sound.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
